</head>
<body>
  <div id="wrap"><div id="app"></div></div>
  <div id="modal"><div id="modalCard">
    <div class="ch" id="modalTitle"></div>
    <div class="cb"><div id="modalBody"></div>
      <button class="btn ink" id="modalClose" style="margin-top:12px">關閉</button></div>
  </div></div>
  <div id="confirm"><div id="confirmCard">
    <div class="ch" id="cfTitle"></div>
    <div class="cb"><div id="cfBody"></div>
      <div class="cfrow"><button class="btn ink" id="cfNo">取消</button>
      <button class="btn green" id="cfYes">確定</button></div></div>
  </div></div>
  <div id="toast"></div>
  <div id="pwaUpdate" class="update-prompt" hidden><span>網站已更新，請重新載入最新版本。</span><button id="applyUpdate" class="btn xs gold">更新</button></div>
  <div id="bootFallback" class="boot-fallback" hidden>
    <div class="boot-fallback-icon" aria-hidden="true">↻</div>
    <div><strong>頁面載入不完整</strong><p>Safari 可能仍使用上一版快取，請清除本網站快取後重新載入。</p></div>
    <button type="button" id="bootRecover" class="btn gold">清除快取並重載</button>
  </div>
  <button type="button" id="installPwa" class="pwa-install-fab">安裝 App</button>


  <nav id="bottomNav" class="bottom-nav" aria-label="主要導覽">
    <div class="nav-rail-mark" aria-hidden="true"></div>
    <button type="button" data-route="/" class="bottom-nav-item active" aria-current="page" aria-label="觀戰：即時看場">
      <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 32 32" focusable="false" shape-rendering="crispEdges"><rect x="4" y="7" width="24" height="18"/><rect x="7" y="10" width="18" height="12" fill="#14110f"/><rect x="10" y="13" width="4" height="4"/><rect x="18" y="13" width="4" height="4"/><rect x="13" y="18" width="6" height="2"/><rect x="12" y="25" width="8" height="3"/></svg></span>
      <span class="nav-label">觀戰</span><span class="nav-caption">即時看場</span>
    </button>
    <button type="button" data-route="/team" class="bottom-nav-item" aria-label="隊輔：隊伍操作">
      <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 32 32" focusable="false" shape-rendering="crispEdges"><rect x="7" y="5" width="8" height="8"/><rect x="5" y="14" width="12" height="10"/><rect x="19" y="8" width="7" height="7"/><rect x="18" y="16" width="10" height="9"/><rect x="3" y="24" width="26" height="3"/></svg></span>
      <span class="nav-label">隊輔</span><span class="nav-caption">隊伍操作</span>
    </button>
    <button type="button" data-route="/admin" class="bottom-nav-item" aria-label="控制台：主持管理">
      <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 32 32" focusable="false" shape-rendering="crispEdges"><rect x="5" y="5" width="22" height="17"/><rect x="8" y="8" width="16" height="11" fill="#14110f"/><rect x="11" y="11" width="3" height="3"/><rect x="16" y="11" width="3" height="3"/><rect x="21" y="11" width="3" height="3"/><rect x="13" y="16" width="6" height="2"/><rect x="10" y="24" width="12" height="3"/><rect x="7" y="27" width="18" height="2"/></svg></span>
      <span class="nav-label">控制台</span><span class="nav-caption">主持管理</span>
    </button>
  </nav>
  <script>
    (function(){
      window.__appBooted = false;
      var fallback = document.getElementById('bootFallback');
      var app = document.getElementById('app');
      function showFallback(err){
        if(fallback){
          fallback.hidden = false;
          if(err){
            var p = fallback.querySelector('p');
            if(p) p.textContent = '載入錯誤資訊：' + (err.stack || err.message || String(err));
          }
        }
      }
      window.addEventListener('error', function(e){ if(!window.__appBooted) showFallback(e.error || e.message || '載入腳本時發生錯誤'); });
      window.addEventListener('unhandledrejection', function(e){ if(!window.__appBooted) showFallback(e.reason || '非同步請求錯誤'); });
      function recover(){
        var jobs = [];
        if('serviceWorker' in navigator){ jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); })); }
        if('caches' in window){ jobs.push(caches.keys().then(function(keys){ return Promise.all(keys.map(function(key){ return caches.delete(key); })); })); }
        Promise.all(jobs).catch(function(){}).then(function(){ location.replace(location.pathname + '?recover=' + Date.now()); });
      }
      window.__showBootFallback = showFallback;
      document.getElementById('bootRecover').addEventListener('click', recover);
      window.setTimeout(function(){ if(!window.__appBooted && app && !app.children.length) showFallback(); }, 5000);
    }());
  </script>
  <script type="module" crossorigin="anonymous" src="./app.js?v=2026.08.21.23"></script>















</body>
