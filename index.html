<style>@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

<div id="wrap"><div id="app"></div></div>
<div id="modal"><div id="modalCard">
  <div class="ch" id="modalTitle"></div>
  <div class="cb"><div id="modalBody"></div>
    <button class="btn ink" id="modalClose" style="margin-top:12px">關閉</button></div>
</div></div>

  <div class="ch" id="cfTitle"></div>
  <div class="cb"><div id="cfBody"></div>
    <div class="cfrow"><button class="btn ink" id="cfNo">取消</button>
    <button class="btn green" id="cfYes">確定</button></div></div>
</div></div>
<div id="toast"></div>
<button id="bHome">回首頁</button>
<script>

const G = (function(){
/* ===== 人生大富翁 — 遊戲核心邏輯（可獨立測試） ===== */

const TRACK = [
  ["black",5,0],["safe",6,0],["base",7,0],["tax",7,1],
  ["stage",8,1],["fate",8,2],["base",9,2],["casino",9,3],
  ["safe",10,3],["fate",10,4],["base",10,5],["stage",10,6],
  ["worm",10,7],["exch",10,8],["tax",9,8],["base",9,9],
  ["safe",8,9],["base",7,9],["fate",7,8],["casino",6,8],
  ["bank",6,7],["base",5,7],["black",4,7],["safe",4,8],
  ["stage",4,9],["safe",3,9],["casino",2,9],["safe",1,9],
  ["base",0,9],["tax",0,8],["fate",0,7],["start",0,6],
  ["fate",0,5],["exch",1,5],["stage",2,5],["base",2,4],
  ["fate",3,4],["worm",4,4],["base",5,4],["fate",6,4],
  ["stage",6,3],["base",6,2],["jail",5,2],["fate",5,1],
];
const N = TRACK.length;
const START_IDX = TRACK.findIndex(t => t[0] === "start");
const BASE_IDX = TRACK.map((t,i)=>t[0]==="base"?i:-1).filter(i=>i>=0);
const STAGE_IDX = TRACK.map((t,i)=>t[0]==="stage"?i:-1).filter(i=>i>=0);
const WORM_IDX = TRACK.map((t,i)=>t[0]==="worm"?i:-1).filter(i=>i>=0);

const TILE = {
  base:{n:"基地",bg:"#3fbf5a",fg:"#0f3d18"}, fate:{n:"命運",bg:"#f2c12e",fg:"#5a3d05"},
  tax:{n:"稅收",bg:"#3f86e0",fg:"#0b2c55"},  black:{n:"黑市",bg:"#6d72b0",fg:"#141033"},
  casino:{n:"賭場",bg:"#9450d8",fg:"#ffffff"},stage:{n:"關卡",bg:"#ffffff",fg:"#1f7a2e"},
  worm:{n:"蟲洞",bg:"#2a0a0a",fg:"#f0908a"}, exch:{n:"交易所",bg:"#57a3a3",fg:"#0d2e2e"},
  jail:{n:"監獄",bg:"#5f5f5f",fg:"#ffffff"}, bank:{n:"銀行",bg:"#2bb0b0",fg:"#0a3838"},
  start:{n:"起點",bg:"#141414",fg:"#ffe14d"},safe:{n:"安全",bg:"#e4d8ad",fg:"#5a4d1f"},
};

const TEAM_COLORS = ["#e23b3b","#3f86e0","#3fbf5a","#f2c12e","#9450d8",
                     "#e6832a","#17a2a2","#d13f8c","#6b7fd0","#8a6a2a"];
const LIGHT_FG = [3];

const DEFAULTS = {
  startCash:2000, lapBonus:300, taxAmount:200,
  casinoCost:150, casinoPayouts:[0,150,300,600],
  blackDiscount:50, bankShare:50, round1Fraction:3,
  levels:[{name:"空地",stay:0,up:0,sell:200},
          {name:"商店",stay:300,up:6,sell:500},
          {name:"賭場",stay:800,up:12,sell:1000}],
  passRatio:20,
  market:{bubble:250,hot:150,flat:100,slump:70,crash:40},
  marketOrder:["bubble","hot","flat","slump","crash"],
  marketNames:{bubble:"泡沫",hot:"熱絡",flat:"平穩",slump:"低迷",crash:"崩盤"},
  attacks:{
    quake:{name:"地震",cost:4,repair:300},
    missile:{name:"飛彈",cost:3,repair:400},
    typhoon:{name:"颱風",cost:4,repair:300,eyeBonus:200},
    wildfire:{name:"野火",cost:3,repair:250},
  },
  gambles:[{name:"紅包",cost:1},{name:"戳戳樂",cost:2},
           {name:"樂透",cost:4},{name:"全押",cost:6}],
  buffs:{pass:{name:"通行證",cost:3},reroll:{name:"重骰卡",cost:2},shield:{name:"防災卡",cost:4}},
  battlesPerTeam:2, inflateThreshold:5, diceSides:6,
};

const FATE_CARDS = [
  {t:"關主心情好，發放獎金",cash:300,pts:0},
  {t:"被抓到偷懶，罰款",cash:-200,pts:0},
  {t:"諂媚成功，獲得點點",cash:0,pts:2},
  {t:"營服洗壞了，賠償",cash:-150,pts:0},
  {t:"撿到隊輔的零錢包",cash:250,pts:0},
  {t:"團康表現優異，加碼",cash:400,pts:1},
  {t:"遲到集合，扣款",cash:-250,pts:0},
  {t:"幫忙搬器材，工資入袋",cash:200,pts:1},
  {t:"手機沒電找不到人，罰款",cash:-100,pts:0},
  {t:"夜教勇氣獎",cash:350,pts:0},
  {t:"被關主吐槽，扣點點",cash:0,pts:-2},
  {t:"隊呼喊得最大聲",cash:150,pts:1},
];

/* ---------- 工具 ---------- */
const clone = o => JSON.parse(JSON.stringify(o));
const money = n => "$" + Number(n).toLocaleString();

function freshState(code, teamCount, names) {
  return {
    rev:1, code, phase:"setup", round:1,
    teams: Array.from({length:teamCount}, (_,i) => ({
      id:i, name:(names && names[i]) || `第 ${i+1} 組`, color:TEAM_COLORS[i%TEAM_COLORS.length],
      cash:DEFAULTS.startCash, pts:0, pos:START_IDX, baseIdx:null, level:1,
      jail:0, battles:DEFAULTS.battlesPerTeam, sold:false, soldRound:0,
      buffs:{pass:0,reroll:0,shield:0}, discount:false, rolled:false, joined:false,
    })),
    bank:0, market:"flat", disasters:0, unlocked:[], log:[],
    settings: clone(DEFAULTS), lastRoll:null,
  };
}

// 過夜費：停在別人基地要付
function stayFee(s, team) {
  let fee = s.settings.levels[team.level-1].stay;
  if (s.round === 1) fee = Math.round(fee / Math.max(1, s.settings.round1Fraction));
  return fee;
}
// 通行費：僅經過，為過夜費的一定比例
function passFee(s, team) {
  return Math.round(stayFee(s, team) * s.settings.passRatio / 100);
}
function sellValue(s, team) {
  const lv = s.settings.levels[team.level-1];
  return Math.round(lv.sell * (s.settings.market[s.market]/100));
}
function netWorth(s, t) {
  return t.cash + ((t.sold || t.baseIdx === null) ? 0 : sellValue(s, t));
}
function ownerOf(s, idx) {
  return s.teams.find(t => t.baseIdx === idx && !t.sold) || null;
}
function pay(s, from, to, amt) {
  if (amt <= 0) return 0;
  s.teams[from].cash -= amt;
  if (to === "bank") s.bank += amt; else s.teams[to].cash += amt;
  return amt;
}

/* ---------- 抽籤 ---------- */
function assignBases(s, rnd = Math.random) {
  const pool = [...BASE_IDX];
  for (let i = pool.length-1; i > 0; i--) {
    const j = Math.floor(rnd()*(i+1)); [pool[i],pool[j]] = [pool[j],pool[i]];
  }
  s.teams.forEach((t,i) => { t.baseIdx = pool[i % pool.length]; t.level = 1; });
  s.log.unshift("抽籤完成，各隊領地已分配");
  return s;
}

/* ---------- 移動 ---------- */
function applyMove(s, ti, steps, rnd = Math.random) {
  const t = s.teams[ti];
  const notes = [];
  if (t.jail > 0) {
    t.jail -= 1; t.rolled = true;
    s.lastRoll = {team:ti, n:steps, note:"在監獄中，本回合不移動"};
    s.log.unshift(`${t.name} 在監獄中，跳過本回合`);
    return s;
  }
  const from = t.pos;
  let usedPass = false;
  const hasPass = t.buffs.pass > 0;

  // 經過的格子（不含終點）
  for (let k = 1; k < steps; k++) {
    const p = (from + k) % N;
    if (p === START_IDX) { t.cash += s.settings.lapBonus; notes.push(`經過起點 +${money(s.settings.lapBonus)}`); }
    const own = ownerOf(s, p);
    if (own && own.id !== ti) {
      const amt = passFee(s, own);
      if (amt > 0) {
        if (hasPass) { usedPass = true; }
        else { pay(s, ti, own.id, amt); notes.push(`通行費 ${money(amt)} → ${own.name}`); }
      }
    }
  }
  // 終點
  const dest = (from + steps) % N;
  if (dest === START_IDX) { t.cash += s.settings.lapBonus; notes.push(`停在起點 +${money(s.settings.lapBonus)}`); }
  t.pos = dest;

  landEffect(s, ti, notes, {hasPass, markPass:() => { usedPass = true; }}, rnd);

  if (usedPass) { t.buffs.pass -= 1; notes.push("通行證生效，免付費用"); }
  t.rolled = true;
  s.lastRoll = {team:ti, n:steps, note:notes.join("；") || "平安無事"};
  s.log.unshift(`${t.name} 骰出 ${steps} → ${TILE[TRACK[t.pos][0]].n}${notes.length ? "：" + notes.join("；") : ""}`);
  return s;
}

function landEffect(s, ti, notes, passCtl, rnd = Math.random) {
  const t = s.teams[ti];
  const S = s.settings;
  const kind = TRACK[t.pos][0];

  if (kind === "base") {
    const own = ownerOf(s, t.pos);
    if (own && own.id !== ti) {
      const amt = stayFee(s, own);
      if (amt > 0) {
        if (passCtl.hasPass) { passCtl.markPass(); notes.push("通行證抵銷過夜費"); }
        else { pay(s, ti, own.id, amt); notes.push(`過夜費 ${money(amt)} → ${own.name}`); }
      }
    } else if (own) notes.push("回到自己的基地");
    else notes.push("無主空地");

  } else if (kind === "tax") {
    pay(s, ti, "bank", S.taxAmount); notes.push(`稅收 −${money(S.taxAmount)}`);

  } else if (kind === "fate") {
    const c = FATE_CARDS[Math.floor(rnd()*FATE_CARDS.length)];
    t.cash += c.cash; t.pts = Math.max(0, t.pts + c.pts);
    notes.push(`命運「${c.t}」${c.cash ? ` ${c.cash>0?"+":""}${money(c.cash)}` : ""}${c.pts ? ` 點點${c.pts>0?"+":""}${c.pts}` : ""}`);

  } else if (kind === "black") {
    t.discount = true; notes.push(`黑市：下次商店消費打 ${S.blackDiscount/10} 折`);

  } else if (kind === "casino") {
    // 賭資先進銀行池，獎金再從池中支付；池子不足則只能領到池中餘額
    t.cash -= S.casinoCost;
    s.bank += S.casinoCost;
    const draw = S.casinoPayouts[Math.floor(rnd()*S.casinoPayouts.length)];
    const win = Math.min(draw, s.bank);
    s.bank -= win; t.cash += win;
    notes.push(`賭場：押 ${money(S.casinoCost)}，${win ? `拿回 ${money(win)}` : "全數落空"}${win < draw ? "（銀行餘額不足）" : ""}`);

  } else if (kind === "bank") {
    const take = Math.max(0, Math.round(s.bank * S.bankShare/100));
    s.bank -= take; t.cash += take;
    notes.push(`銀行密道：幹走 ${money(take)}`);

  } else if (kind === "worm") {
    const other = WORM_IDX.find(i => i !== t.pos);
    t.pos = other; notes.push("蟲洞傳送");

  } else if (kind === "jail") {
    t.jail = 1; notes.push("滾進監獄，下回合停留");

  } else if (kind === "exch") {
    notes.push("交易所：可查看命運卡前三張");

  } else if (kind === "stage") {
    notes.push(s.unlocked.includes(t.pos) ? "關卡已解封，觸發關卡技能" : "關卡尚未解封");
  }
  return notes;
}

/* ---------- 商店 ---------- */
function costWithDiscount(s, t, base) {
  return t.discount ? Math.max(1, Math.ceil(base * s.settings.blackDiscount/100)) : base;
}
function buyGamble(s, ti, gi) {
  const t = s.teams[ti], g = s.settings.gambles[gi];
  const cost = costWithDiscount(s, t, g.cost);
  if (t.pts < cost) return {ok:false, msg:"諂媚之點不足"};
  t.pts -= cost; if (t.discount) t.discount = false;
  s.log.unshift(`${t.name} 買了「${g.name}」（扣 ${cost} 點，獎項由關主現場發放）`);
  return {ok:true};
}
function buyBuff(s, ti, bk) {
  const t = s.teams[ti], b = s.settings.buffs[bk];
  const cost = costWithDiscount(s, t, b.cost);
  if (t.pts < cost) return {ok:false, msg:"諂媚之點不足"};
  t.pts -= cost; t.buffs[bk] += 1; if (t.discount) t.discount = false;
  s.log.unshift(`${t.name} 取得「${b.name}」`);
  return {ok:true};
}
function upgradeBase(s, ti) {
  const t = s.teams[ti];
  if (t.sold) return {ok:false, msg:"基地已賣出"};
  if (t.level >= s.settings.levels.length) return {ok:false, msg:"已達最高等級"};
  const need = s.settings.levels[t.level].up;
  if (t.pts < need) return {ok:false, msg:"諂媚之點不足"};
  t.pts -= need; t.level += 1;
  s.log.unshift(`${t.name} 基地升級為「${s.settings.levels[t.level-1].name}」`);
  return {ok:true};
}
function sellBase(s, ti) {
  const t = s.teams[ti];
  if (t.sold || t.baseIdx === null) return {ok:false, msg:"沒有可賣的基地"};
  const v = sellValue(s, t);
  t.cash += v; t.sold = true; t.soldRound = s.round;
  s.log.unshift(`${t.name} 賣出基地 +${money(v)}`);
  return {ok:true};
}
function buyBackBase(s, ti) {
  const t = s.teams[ti];
  if (!t.sold) return {ok:false, msg:"目前持有基地"};
  if (s.round <= t.soldRound) return {ok:false, msg:"須繞完一圈才可買回"};
  const v = sellValue(s, t);
  if (t.cash < v) return {ok:false, msg:"現金不足"};
  t.cash -= v; t.sold = false;
  s.log.unshift(`${t.name} 買回基地 −${money(v)}`);
  return {ok:true};
}

/* ---------- 災害 ---------- */
function tilesInSquare(col, row, half) {
  const out = [];
  for (let i = 0; i < N; i++) {
    const [,c,r] = TRACK[i];
    if (Math.abs(c-col) <= half && Math.abs(r-row) <= half) out.push(i);
  }
  return out;
}
function playAttack(s, ti, kind, rnd = Math.random) {
  const t = s.teams[ti], A = s.settings.attacks[kind];
  const cost = costWithDiscount(s, t, A.cost);
  if (t.pts < cost) return {ok:false, msg:"諂媚之點不足"};
  t.pts -= cost; if (t.discount) t.discount = false;
  s.disasters += 1;
  let hit = [], msg = "";

  const damage = (idx, amt) => {
    const o = ownerOf(s, idx);
    if (!o) return;
    if (s.teams[o.id].buffs.shield > 0) { s.teams[o.id].buffs.shield -= 1; return; }
    pay(s, o.id, "bank", amt);
  };

  if (kind === "quake") {
    const ep = Math.floor(rnd()*N); const [,c,r] = TRACK[ep];
    hit = tilesInSquare(c, r, 3);
    msg = `震央第 ${ep+1} 格`;
    hit.forEach(i => damage(i, i === ep ? Math.round(A.repair*1.5) : A.repair));

  } else if (kind === "typhoon") {
    const ep = Math.floor(rnd()*N); const [,c,r] = TRACK[ep];
    const eye = tilesInSquare(c, r, 1);
    hit = tilesInSquare(c, r, 3);
    msg = `颱風眼第 ${ep+1} 格`;
    hit.forEach(i => {
      const o = ownerOf(s, i); if (!o) return;
      if (eye.includes(i)) { s.teams[o.id].cash += A.eyeBonus; return; }
      damage(i, A.repair);
    });

  } else if (kind === "wildfire") {
    const rows = [...new Set([Math.floor(rnd()*10), Math.floor(rnd()*10)])];
    hit = TRACK.map((tt,i) => rows.includes(tt[2]) ? i : -1).filter(i => i>=0);
    msg = `延燒第 ${rows.map(x=>x+1).join("、")} 排`;
    hit.forEach(i => damage(i, A.repair));

  } else if (kind === "missile") {
    const rank = [...s.teams].sort((a,b) => netWorth(s,b) - netWorth(s,a));
    const mine = rank.findIndex(x => x.id === ti);
    const target = rank[mine-1] || rank[mine+1];
    if (!target) { t.pts += cost; s.disasters -= 1; return {ok:false, msg:"沒有可攻擊的對手"}; }
    msg = `鎖定 ${target.name}`;
    if (s.teams[target.id].buffs.shield > 0) s.teams[target.id].buffs.shield -= 1;
    else pay(s, target.id, "bank", A.repair);
    hit = target.baseIdx !== null ? [target.baseIdx] : [];
  }
  s.log.unshift(`${t.name} 發動「${A.name}」— ${msg}`);
  return {ok:true, hit};
}

/* ---------- 回合流程 ---------- */
const PHASES = ["market","sell","shop","roll"];
function nextPhase(s) {
  const i = PHASES.indexOf(s.phase);
  if (i < 0) return s;
  if (i < PHASES.length-1) { s.phase = PHASES[i+1]; return s; }
  const d = s.disasters, th = s.settings.inflateThreshold;
  s.market = d >= th+3 ? "bubble" : d > th ? "hot" : d === th ? "flat" : d >= Math.max(1,th-2) ? "slump" : "crash";
  s.round += 1; s.disasters = 0; s.phase = "market";
  s.teams.forEach(t => { t.rolled = false; });
  s.log.unshift(`── 第 ${s.round} 回合開始（股市：${s.settings.marketNames[s.market]}）──`);
  return s;
}

const Net = {
  mode: "solo", url: "", code: "", etag: null,
  norm(u){ let s=(u||"").trim().replace(/\/+$/,""); if(s&&!/^https?:\/\//.test(s)) s="https://"+s; return s; },
  async probe(){
    if(this.mode!=="url") return true;
    const r = await fetch(this.url+"/.json?shallow=true",{cache:"no-store"});
    return r.ok;
  },
  async get(code){
    if(this.mode==="solo"){
      const raw = localStorage.getItem("mono:"+code);
      return raw ? JSON.parse(raw) : null;
    }
    const r = await fetch(`${this.url}/rooms/${code}.json`,{cache:"no-store",headers:{"X-Firebase-ETag":"true"}});
    if(!r.ok) throw new Error("read "+r.status);
    this.etag = r.headers.get("ETag");
    const j = await r.json();
    return j || null;
  },
  async put(code, obj){
    if(this.mode==="solo"){ localStorage.setItem("mono:"+code, JSON.stringify(obj)); return {ok:true}; }
    const h = {"Content-Type":"application/json","X-Firebase-ETag":"true"};
    if(this.etag) h["if-match"] = this.etag;
    const r = await fetch(`${this.url}/rooms/${code}.json`,{method:"PUT",headers:h,body:JSON.stringify(obj)});
    if(r.status===412){ this.etag = r.headers.get("ETag"); return {ok:false,conflict:true}; }
    if(!r.ok) throw new Error("write "+r.status);
    this.etag = r.headers.get("ETag");
    return {ok:true};
  }
};

/* 讀-改-寫，遇到衝突自動重試 */
async function commit(mut){
  if(App.busy || !Net.code) return;
  App.busy = true;
  try{
    for(let attempt=0; attempt<4; attempt++){
      const cur = await Net.get(Net.code);
      if(!cur){ toast("找不到房間資料",1); break; }
      const next = G.clone(cur);
      const res = mut(next);
      if(res === false) break;
      next.rev = (cur.rev||0)+1;
      const w = await Net.put(Net.code, next);
      if(w.ok){ App.rev = next.rev; App.S = next; render(true); break; }
      if(attempt===3) toast("多人同時操作，請再按一次",1);
    }
  }catch(e){ toast("連線失敗："+e.message,1); }
  finally{ App.busy = false; }
}

let pollTimer = null;
function startPoll(){
  clearInterval(pollTimer);
  pollTimer = setInterval(async ()=>{
    if(App.busy || !Net.code) return;
    try{
      const r = await Net.get(Net.code);
      if(r && r.rev > App.rev){ App.rev = r.rev; App.S = r; render(); }
    }catch(e){ /* 暫時斷線，下次輪詢再試 */ }
  }, 2000);
}

}

    ${S.teams.map((t,i)=>`<button class="btn slot" data-i="${i}"
      style="background:${t.joined?"#b9b3a2":t.color};color:${!t.joined&&G.LIGHT_FG.includes(i)?"#14110f":"#fff"}">
      ${esc(t.name)}${t.joined?"（已有人選，可接手）":""}</button>`).join("")}
    <div class="note">選錯或手機重整了？直接再點一次同一組就能接手回來，不會被鎖住。</div>
  </div></div>`;
  document.querySelectorAll(".slot").forEach(b=>{
    b.onclick = async ()=>{
      const i = Number(b.dataset.i);
      if(App.S.teams[i].joined && !confirm(`${App.S.teams[i].name} 已經有人選了。\n如果那是你自己（手機重整過）就按確定接手；\n如果是別組，請按取消改選其他組。`)) return;
      App.myTeam = i;
      await commit(s=>{ s.teams[i].joined = true; });
      App.screen="game"; saveSession(); render(true);
    };
  });
}

/* ===== 棋盤 ===== */
function boardHTML(){
  const S = App.S, cell=46, gap=4;
  const W = 11*(cell+gap), H = 10*(cell+gap);
  let out = `<div class="bwrap ${App.zoom?"zoomed":"fit"}" id="bwrap"><div class="board" id="board" style="width:${W}px;height:${H}px">`;
  G.TRACK.forEach((t,i)=>{
    const [kind,c,r] = t, T = G.TILE[kind];
    const own = G.ownerOf(S,i);
    const here = S.teams.filter(x=>x.pos===i);
    const hot = App.highlight.includes(i);
    const locked = kind==="stage" && !S.unlocked.includes(i);
    out += `<div class="tile" data-i="${i}" style="left:${c*(cell+gap)}px;top:${r*(cell+gap)}px;
      background:${hot?"#ffdcdc":T.bg};border-color:${hot?"#e23b3b":"#14110f"}">
      ${sprite(kind,22)}<div class="tl" style="color:${T.fg}">${T.n}</div>
      ${locked?'<div class="lock"></div>':""}
      ${own?`<div class="ow" style="background:${own.color};color:${G.LIGHT_FG.includes(own.id)?"#14110f":"#fff"}">${own.id+1}</div>`:""}
      ${here.length?`<div class="pins">${here.slice(0,4).map(h=>`<i style="background:${h.color}">${h.id+1}</i>`).join("")}${here.length>4?`<i class="more">+${here.length-4}</i>`:""}</div>`:""}
    </div>`;
  });
  return out+`</div></div><button class="btn sm gold" id="bZoom">${App.zoom?"符合螢幕":"放大檢視"}</button>`;
}

/* 把棋盤縮放到剛好塞滿畫面寬度 */
function fitBoard(){
  const wrap = $("bwrap"), bd = $("board");
  if(!wrap || !bd) return;
  if(App.zoom){ bd.style.transform=""; wrap.style.height=""; return; }
  const avail = wrap.clientWidth;
  const w = parseFloat(bd.style.width);
  const k = Math.min(1, avail / w);
  bd.style.transformOrigin = "top left";
  bd.style.transform = `scale(${k})`;
  wrap.style.height = (parseFloat(bd.style.height) * k) + "px";
}

function tileDesc(i){
  const S = App.S, kind = G.TRACK[i][0], own = G.ownerOf(S,i);
  const d = {
    base: own ? `第 ${own.id+1} 組「${own.name}」的領地<br>Lv${own.level}「${S.settings.levels[own.level-1].name}」<br>通行費 ${G.money(G.passFee(S,own))}　過夜費 ${G.money(G.stayFee(S,own))}` : "無主空地",
    fate:"抽一張機會與命運卡",
    tax:`繳 ${G.money(S.settings.taxAmount)} 進銀行池`,
    black:`下次商店消費打 ${S.settings.blackDiscount/10} 折`,
    casino:`押 ${G.money(S.settings.casinoCost)} 賭一把，獎金由銀行池支付`,
    stage: S.unlocked.includes(i) ? "已解封，觸發對應關卡技能" : "尚未解封，關卡結束後由工作人員開啟",
    worm:"傳送到另一個蟲洞",
    exch:"查看命運卡最上面三張",
    jail:"停留一回合",
    bank:`幹走銀行池 ${S.settings.bankShare}%（目前 ${G.money(S.bank)}）`,
    start:`每經過一次 +${G.money(S.settings.lapBonus)}`,
    safe:"安全格，不會發生任何事",
  }[kind];
  return d;
}

  h += f("第1回合費用除以","round1Fraction",S.settings.round1Fraction);

  S.settings.levels.forEach((lv,i)=>{
    h += `<div class="grp"><b>Lv${i+1}「${lv.name}」</b>`;
    h += f("過夜費",`levels.${i}.stay`,lv.stay);

    h += f("賣出價值",`levels.${i}.sell`,lv.sell);
    h += `</div>`;
  });
  h += `<div class="sub">攻擊卡</div>`;
  Object.entries(S.settings.attacks).forEach(([k,a])=>{
    h += `<div class="grp"><b>${a.name}</b>`;
    h += f("點點花費",`attacks.${k}.cost`,a.cost);
    h += f("修繕費",`attacks.${k}.repair`,a.repair);
    h += `</div>`;
  });
  h += `<div class="sub">賭一把</div>`;

    h += f(g.name+" 點數",`gambles.${i}.cost`,g.cost);

  S.settings.marketOrder.forEach(k=>{
    h += f(S.settings.marketNames[k],`market.${k}`,S.settings.market[k],"%");
  });
  return h+`</div>`;
}

/* ===== 事件綁定 ===== */
function bindGame(){
  const S = App.S;
  document.querySelectorAll(".tb").forEach(b=>b.onclick=()=>{ App.tab=b.dataset.k; render(true); });
  document.querySelectorAll(".pick2").forEach(b=>b.onclick=()=>{ App.myTeam=Number(b.dataset.i); App.dice=null; render(true); });
  document.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{
    const i = Number(t.dataset.i);
    $("modalTitle").textContent = `第 ${i+1} 格 — ${G.TILE[G.TRACK[i][0]].n}`;
    $("modalBody").innerHTML = `<div class="mrow">${sprite(G.TRACK[i][0],40)}<div>${tileDesc(i)}</div></div>`;
    $("modal").style.display = "flex";
  });

  const bind = (id, fn) => { const e=$(id); if(e) e.onclick=fn; };
  bind("bZoom", ()=>{ App.zoom=!App.zoom; render(true); });

  bind("bRoll", ()=>ask("擲骰子？", `${esc(S.teams[App.myTeam].name)} 準備移動`, doRollNow));
  async function doRollNow(){
    if(App.rolling || App.myTeam===null) return;
    App.rolling = true; render(true);
    const d = $("dice"); let n=1;
    const sides = App.S.settings.diceSides || 6;
    const iv = setInterval(()=>{ n=1+Math.floor(Math.random()*sides); if(d) d.textContent=n; },70);
    await new Promise(r=>setTimeout(r,900));
    clearInterval(iv);
    n = 1+Math.floor(Math.random()*sides);
    App.dice = n; App.rolling = false;
    if(d) d.textContent = n;
    await commit(s=>{ if(s.teams[App.myTeam].rolled) return false; G.applyMove(s, App.myTeam, n); });
  }
  bind("bReroll", ()=>ask("使用重骰卡？", "會清除本次骰點，重新骰一次", ()=>commit(s=>{
    const t=s.teams[App.myTeam];
    if(t.buffs.reroll<=0) return false;
    t.buffs.reroll-=1; t.rolled=false;
    s.log.unshift(`${t.name} 使用重骰卡`);
  })));
  bind("bBattle", ()=>ask("使用 BATTLE？", `整個營期只有 ${S.settings.battlesPerTeam} 次，用掉不能復原`, ()=>commit(s=>{
    const t=s.teams[App.myTeam];
    if(t.battles<=0) return false;
    t.battles-=1; s.log.unshift(`${t.name} 使用 BATTLE（剩 ${t.battles} 次），由關主裁決`);
  })));
  document.querySelectorAll(".atk").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k, a=S.settings.attacks[k];
    ask(`發動「${a.name}」？`, `花費 ${G.costWithDiscount(S,S.teams[App.myTeam],a.cost)} 點<br>受災基地要付修繕費 ${G.money(a.repair)}`, ()=>commit(s=>{
      const r = G.playAttack(s, App.myTeam, k);
      if(!r.ok){ toast(r.msg,1); return false; }
      App.highlight = r.hit || [];
      setTimeout(()=>{ App.highlight=[]; render(true); }, 6000);
    }));
  });
  document.querySelectorAll(".gam").forEach(b=>b.onclick=()=>{
    const i=Number(b.dataset.i), g=S.settings.gambles[i];
    ask(`購買「${g.name}」？`, `扣 ${G.costWithDiscount(S,S.teams[App.myTeam],g.cost)} 點<br>獎項由關主現場發放`, ()=>commit(s=>{
      const r=G.buyGamble(s,App.myTeam,i); if(!r.ok){toast(r.msg,1);return false;}
    }));
  });
  document.querySelectorAll(".buf").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k, bf=S.settings.buffs[k];
    ask(`購買「${bf.name}」？`, `扣 ${G.costWithDiscount(S,S.teams[App.myTeam],bf.cost)} 點`, ()=>commit(s=>{
      const r=G.buyBuff(s,App.myTeam,k); if(!r.ok){toast(r.msg,1);return false;}
    }));
  });
  bind("bUp", ()=>{ const me2=S.teams[App.myTeam];
    ask("升級基地？", `Lv${me2.level} → Lv${me2.level+1}，扣 ${S.settings.levels[me2.level].up} 點`, ()=>commit(s=>{
      const r=G.upgradeBase(s,App.myTeam); if(!r.ok){toast(r.msg,1);return false;} })); });
  bind("bSell", ()=>ask("賣出基地？", `入帳 ${G.money(G.sellValue(S,S.teams[App.myTeam]))}<br><b>須繞完一圈才能買回</b>`, ()=>commit(s=>{
    const r=G.sellBase(s,App.myTeam); if(!r.ok){toast(r.msg,1);return false;} })));
  bind("bBuyBack", ()=>ask("買回基地？", `支出 ${G.money(G.sellValue(S,S.teams[App.myTeam]))}`, ()=>commit(s=>{
    const r=G.buyBackBase(s,App.myTeam); if(!r.ok){toast(r.msg,1);return false;} })));

  bind("bAssign", ()=>ask("重新抽籤？", "會重新分配所有隊伍的基地", ()=>commit(s=>{ G.assignBases(s); })));
  bind("bStart", ()=>ask("開始遊戲？", "開始後進入第 1 回合", ()=>commit(s=>{
    if(s.teams.some(t=>t.baseIdx===null)){ toast("請先抽籤分配基地",1); return false; }
    s.phase="market"; s.round=1; s.log.unshift("遊戲開始，第 1 回合");
  })));
  bind("bNext", ()=>{
    const last = S.phase==="roll";
    const unrolled = S.teams.filter(t=>!t.rolled).map(t=>t.name);
    ask(last?"結束本回合？":"進入下一階段？",
        last ? (unrolled.length?`還有 ${unrolled.length} 隊沒骰：${esc(unrolled.join("、"))}`:"全部隊伍都骰過了") : "",
        ()=>commit(s=>{ G.nextPhase(s); }));
  });
  document.querySelectorAll(".mk").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    ask("公布股市？", `${S.settings.marketNames[k]}　賣出價 ×${S.settings.market[k]/100}`, ()=>commit(s=>{
      s.market=k; s.log.unshift(`股市公布：${s.settings.marketNames[k]}`);
    }));
  });
  document.querySelectorAll(".unl").forEach(b=>b.onclick=()=>{
    const i=Number(b.dataset.i);
    ask("解封這個關卡格？", `第 ${i+1} 格，解封後隊伍停留會觸發關卡技能`, ()=>commit(s=>{
      if(!s.unlocked.includes(i)) s.unlocked.push(i);
      s.log.unshift(`關卡格解封（第 ${i+1} 格）`);
    }));
  });
  document.querySelectorAll(".ptgo").forEach(b=>b.onclick=()=>{
    const i=Number(b.dataset.i);
    const inp=document.querySelector(`.ptv[data-i="${i}"]`);
    const n=Number(inp.value);
    if(!n){ toast("請先輸入點數",1); return; }
    ask(`${n>0?"給予":"扣除"}諂媚之點？`, `${esc(S.teams[i].name)}　${n>0?"+":""}${n} 點`, ()=>{
      commit(s=>{ s.teams[i].pts=Math.max(0,s.teams[i].pts+n);
        s.log.unshift(`${s.teams[i].name} 諂媚之點 ${n>0?"+":""}${n}`); });
      inp.value="";
    });
  });
  document.querySelectorAll(".csgo").forEach(b=>b.onclick=()=>{
    const i=Number(b.dataset.i);
    const inp=document.querySelector(`.csv[data-i="${i}"]`);
    const n=Number(inp.value);
    if(!n){ toast("請先輸入金額",1); return; }
    ask(`${n>0?"給予":"扣除"}現金？`, `${esc(S.teams[i].name)}　${n>0?"+":""}${G.money(n)}`, ()=>{
      commit(s=>{ s.teams[i].cash+=n;
        s.log.unshift(`${s.teams[i].name} 現金 ${n>0?"+":""}${G.money(n)}（主持人調整）`); });
      inp.value="";
    });
  });
  document.querySelectorAll(".rel").forEach(b=>b.onclick=()=>commit(s=>{
    const i=Number(b.dataset.i); s.teams[i].joined=false;
    s.log.unshift(`${s.teams[i].name} 的加入狀態已釋放`);
  }));
  bind("bRelAll", ()=>{
    if(!confirm("釋放全部隊伍？各隊需要重新選一次。")) return;
    commit(s=>{ s.teams.forEach(t=>t.joined=false); s.log.unshift("主持人釋放了全部隊伍"); });
  });
  bind("bCfg", ()=>{ App.cfg=!App.cfg; render(true); });
  document.querySelectorAll(".cfg").forEach(inp=>{
    inp.onchange = ()=>commit(s=>{
      const parts = inp.dataset.p.split(".");
      let o = s.settings;
      for(let i=0;i<parts.length-1;i++) o = o[parts[i]];
      o[parts[parts.length-1]] = Number(inp.value);
    });
  });
}

/* ===== 總繪製 ===== */
function render(force){
  if(App.screen==="home"){ renderHome(); return; }
  if(App.screen==="pick"){ renderPick(); return; }
  if(!force && App.S && App.S.rev===App.lastRender) return;
  App.lastRender = App.S ? App.S.rev : -1;
  renderGame();
}

window.addEventListener("DOMContentLoaded", ()=>{
  $("modalClose").onclick = ()=>{ $("modal").style.display="none"; };
  $("modal").onclick = e=>{ if(e.target.id==="modal") $("modal").style.display="none"; };
  $("bHome").onclick = ()=>{
    if(!confirm("回到首頁？目前房間資料會保留，可用房號重新加入。")) return;
    clearInterval(pollTimer); clearSession(); Net.code=""; App.screen="home"; App.S=null; App.myTeam=null; App.role=null;
    render(true);
  };
  render(true);
  window.addEventListener("resize", fitBoard);
  window.addEventListener("orientationchange", ()=>setTimeout(fitBoard,300));
});


</script>
</body>
</html>
