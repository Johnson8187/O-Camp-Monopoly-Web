<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#14110f">
  <meta name="description" content="人生大富翁營隊即時觀戰">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="人生大富翁">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="manifest" href="./manifest.webmanifest?v=2026.08.19.4">
  <link rel="icon" href="./icon.svg?v=2026.08.19.4" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png?v=2026.08.19.4">
  <title>人生大富翁 — 即時觀戰</title>
  <link rel="stylesheet" href="./styles.css?v=2026.08.19.4">
</head>
<body>
  <div id="wrap"><div id="app"></div></div>
  <div id="modal"><div id="modalCard">
    <div class="ch" id="modalTitle"></div>
    <div class="cb"><div id="modalBody"></div>
      <button class="btn ink" id="modalClose" style="margin-top:12px">關閉</button></div>
  </div></div>
  <div id="confirm"><div id="confirmCard">
    <div class="ch" id="cfTitle"></div>
    <div class="cb"><div id="cfBody"></div>
      <div class="cfrow"><button class="btn ink" id="cfNo">取消</button>
      <button class="btn green" id="cfYes">確定</button></div></div>
  </div></div>
  <div id="toast"></div>
  <div id="pwaUpdate" class="update-prompt" hidden><span>網站已更新，請重新載入最新版本。</span><button id="applyUpdate" class="btn xs gold">更新</button></div>
  <div id="bootFallback" class="boot-fallback" hidden>
    <div class="boot-fallback-icon" aria-hidden="true">↻</div>
    <div><strong>頁面載入不完整</strong><p>Safari 可能仍使用上一版快取，請清除本網站快取後重新載入。</p></div>
    <button type="button" id="bootRecover" class="btn gold">清除快取並重載</button>
  </div>
  <button type="button" id="installPwa" class="pwa-install-fab" hidden><span aria-hidden="true">＋</span>安裝 App</button>
  <nav id="bottomNav" class="bottom-nav" aria-label="主要導覽">
    <button type="button" data-route="/" class="bottom-nav-item active" aria-current="page" aria-label="觀戰">
      <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.8"/></svg></span><span class="nav-label">觀戰</span><span class="nav-caption">即時看場</span>
    </button>
    <button type="button" data-route="/team" class="bottom-nav-item" aria-label="隊輔">
      <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c.5-3.3 2.4-5 5.5-5s5 1.7 5.5 5"/><path d="M15 5.5a3 3 0 0 1 0 5.8M17 14c2.2.6 3.4 2.1 3.6 4.5"/></svg></span><span class="nav-label">隊輔</span><span class="nav-caption">隊伍操作</span>
    </button>
    <button type="button" data-route="/admin" class="bottom-nav-item" aria-label="控制台">
      <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M7 21h10M9 18v3M15 18v3M7 8h.01M11 8h.01M15 8h.01M7 12h4M15 12h2"/></svg></span><span class="nav-label">控制台</span><span class="nav-caption">主持管理</span>
    </button>
  </nav>
  <script>
    (function(){
      window.__appBooted = false;
      var fallback = document.getElementById('bootFallback');
      var app = document.getElementById('app');
      function showFallback(){ if(fallback) fallback.hidden = false; }
      function recover(){
        var jobs = [];
        if('serviceWorker' in navigator){ jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); })); }
        if('caches' in window){ jobs.push(caches.keys().then(function(keys){ return Promise.all(keys.map(function(key){ return caches.delete(key); })); })); }
        Promise.all(jobs).catch(function(){}).then(function(){ location.replace(location.pathname + '?recover=' + Date.now()); });
      }
      window.__showBootFallback = showFallback;
      document.getElementById('bootRecover').addEventListener('click', recover);
      window.setTimeout(function(){ if(!window.__appBooted && app && !app.children.length) showFallback(); }, 4500);
    }());
  </script>
  <script type="module" src="./app.js?v=2026.08.19.4"></script>
</body>
</html>
