<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#14110f">
  <meta name="description" content="人生大富翁營隊即時觀戰">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="人生大富翁">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>人生大富翁 — 即時觀戰</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="wrap"><div id="app"></div></div>
  <div id="modal"><div id="modalCard">
    <div class="ch" id="modalTitle"></div>
    <div class="cb"><div id="modalBody"></div>
      <button class="btn ink" id="modalClose" style="margin-top:12px">關閉</button></div>
  </div></div>
  <div id="confirm"><div id="confirmCard">
    <div class="ch" id="cfTitle"></div>
    <div class="cb"><div id="cfBody"></div>
      <div class="cfrow"><button class="btn ink" id="cfNo">取消</button>
      <button class="btn green" id="cfYes">確定</button></div></div>
  </div></div>
  <div id="toast"></div>
  <div id="pwaUpdate" class="update-prompt" hidden><span>網站已更新，請重新載入最新版本。</span><button id="applyUpdate" class="btn xs gold">更新</button></div>
  <nav id="bottomNav" class="bottom-nav" aria-label="主要導覽">
    <button type="button" data-route="/" class="bottom-nav-item active">觀戰</button>
    <button type="button" data-route="/team" class="bottom-nav-item">隊輔</button>
    <button type="button" data-route="/admin" class="bottom-nav-item">控制台</button>
    <button type="button" id="installPwa" class="bottom-nav-item install-pwa" hidden>安裝 App</button>
  </nav>
  <script type="module" src="./app.js"></script>
</body>
</html>
