<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fbf7ec">
  <meta name="description" content="人生大富翁營隊即時連線版">
  <title>人生大富翁 — 即時連線版</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="wrap"><div id="app"></div></div>
  <div id="modal"><div id="modalCard">
    <div class="ch" id="modalTitle"></div>
    <div class="cb"><div id="modalBody"></div>
      <button class="btn ink" id="modalClose" style="margin-top:12px">關閉</button></div>
  </div></div>
  <div id="confirm"><div id="confirmCard">
    <div class="ch" id="cfTitle"></div>
    <div class="cb"><div id="cfBody"></div>
      <div class="cfrow"><button class="btn ink" id="cfNo">取消</button>
      <button class="btn green" id="cfYes">確定</button></div></div>
  </div></div>
  <div id="toast"></div>
  <button id="bHome">回首頁</button>
  <script type="module" src="./app.js"></script>
</body>
</html>
